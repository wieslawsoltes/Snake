name: Diagnose native WebGPU adapter
on:
  push:
    branches: [main]
    paths: [.github/workflows/gpu-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
          node tools/serve.mjs . 8080 > /tmp/server.log 2>&1 &
      - name: Compare supported software adapter paths
        shell: bash
        env:
          DEBUG: pw:browser
        run: |
          cat > /tmp/probe.py <<'PY'
          import json
          from playwright.sync_api import sync_playwright
          common=['--no-sandbox','--enable-unsafe-webgpu','--disable-gpu-watchdog']
          variants={
            'swangle': ['--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader','--use-webgpu-adapter=swiftshader'],
            'vulkan': ['--use-webgpu-adapter=swiftshader','--enable-features=Vulkan','--use-angle=vulkan','--use-vulkan=swiftshader','--disable-vulkan-surface'],
            'default': ['--use-webgpu-adapter=swiftshader','--enable-unsafe-swiftshader'],
          }
          results=[]
          with sync_playwright() as p:
            for name,flags in variants.items():
              browser=p.chromium.launch(headless=False,args=common+flags)
              page=browser.new_page()
              page.on('console',lambda m:print('CONSOLE',m.type,m.text,flush=True))
              page.on('pageerror',lambda e:print('PAGEERROR',e,flush=True))
              page.add_init_script('''
              if(globalThis.GPUDevice){
                for(const name of ['createComputePipelineAsync','createRenderPipelineAsync']){
                  const original=GPUDevice.prototype[name];
                  GPUDevice.prototype[name]=async function(...args){
                    console.log('GPU BEGIN '+name);
                    try{const result=await original.apply(this,args);console.log('GPU END '+name);return result;}
                    catch(error){throw new Error(name+': '+error.message);}
                  };
                }
              }
              ''')
              try:
                page.goto('http://localhost:8080/?debug&nosw',wait_until='domcontentloaded')
                page.wait_for_function('!!window.__snake',timeout=90000)
                page.wait_for_timeout(500)
                result=page.evaluate('window.__snake.inspect()')
                results.append({'variant':name,'flags':flags,'result':result})
                print('RESULT',name,json.dumps(result),flush=True)
              except Exception as e:
                results.append({'variant':name,'error':str(e)})
                print('FAILED',name,str(e),flush=True)
              browser.close()
          open('gpu-probe-results.json','w').write(json.dumps(results,indent=2))
          PY
          xvfb-run -a python -u /tmp/probe.py 2>&1 | tee gpu-probe.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GPU-Probe
          path: |
            gpu-probe.log
            gpu-probe-results.json
